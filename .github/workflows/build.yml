# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main, next, beta, rc, '*.x']
  pull_request:
    branches: '*'

jobs:
  libs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      # Root manifest only - the apps/* projects are excluded, so this installs
      # just what the libraries need to build and test.
      - run: pnpm install --frozen-lockfile --filter="!./apps/*"
      - run: pnpm run build:libs
      - run: pnpm run typecheck
      - run: pnpm run test:libs

  apps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:apps
      - run: pnpm run test:apps

  # apps/docs is outside the workspace with its own lockfile, so it installs and
  # builds entirely on its own - no root install involved.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
      # pnpm audit always reads the whole lockfile - it has no --filter, and
      # --ignore-workspace does not scope it either. Dropping the apps and
      # regenerating a root-only lockfile makes this report on the dependency
      # surface the published libs actually pull in, which is what matters for
      # what we ship to npm. The apps are covered by audit-apps below.
      - run: rm -rf apps/example-app apps/example-api
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm audit --prod

  # Everything, apps included. Split from the libs audit so app and docs
  # tooling advisories cannot drown out the ones affecting published packages.
  audit-apps:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm audit --prod

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    strategy:
      matrix:
        node-version: [24]
    # only allows semantic release on main, next, beta, rc, and 1*x branches, github doesnt do regex matching so we have to manually when we are over version 20
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/rc' || (startsWith(github.ref, 'refs/heads/1') && endsWith(github.ref, '.x')) }}
    needs: [libs, apps]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install pnpm
        # No "version:" here on purpose - it comes from "packageManager" in
        # package.json. Setting both makes the action fail with
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter="!./apps/*"
      - run: pnpm run build:libs
      - run: npm install -g npm@11.7.0
      - run: pnpm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
