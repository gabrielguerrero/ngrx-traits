<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>NgRx Traits</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:site_name" content="NgRx Traits" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://ngrx-traits.dev/ngrx-traits/logo_name_black_horizontal.PNG"
    />
    <meta property="og:image:width" content="2380" />
    <meta property="og:image:height" content="1240" />
    <meta property="og:image:alt" content="NgRx Traits logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://ngrx-traits.dev/ngrx-traits/logo_name_black_horizontal.PNG"
    />
    <script>
      // applies the stored/system theme before first paint to avoid a flash of
      // the wrong theme, ThemeService picks it up from here on the client
      (function () {
        try {
          var theme = localStorage.getItem('ngrx-traits-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="public/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <link
      rel="preconnect"
      href="https://HTXZ7INLYZ-dsn.algolia.net"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-white dark:bg-gray-950">
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
