# Pins for transitive deps whose newest versions are quarantined / not served by the
# company npm firewall (repos.gbt.gbtad.com). Remove once the firewall releases them.
overrides:
  webpack-dev-middleware: 8.2.0 # 8.3.0 needs range-parser@^1.3.0 (unavailable)
  magic-string: 1.2.3 # @angular/build wants 1.4.1, which needs the unreleased sourcemap-codec@1.6.0
  cli-truncate: 6.0.0 # listr2@11.1.0 wants ^6.1.1 (unavailable)
  h3: 1.15.11 # 1.15.5 is quarantined
  npm: 11.6.2 # newer 11.x tarballs are quarantined (semantic-release dep)
  source-map-js: 1.2.1 # newer ^1.2.2 required by some packages is not served
